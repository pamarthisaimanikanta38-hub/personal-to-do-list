<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- Header Section -->
    <header class="header">
      <div class="header-left">
        <svg class="header-icon" viewBox="0 0 24 24" width="38" height="38" fill="none" stroke="#fff" stroke-width="2">
          <rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V2h6v2"/><path d="m9 13 2 2 4-4"/>
        </svg>
        <div class="v-line"></div>
        <div>
          <h1>Personal To-Do List</h1>
          <p><em>Organize • Track • Get Things Done</em></p>
        </div>
      </div>
      <button id="fs-btn" onclick="toggleFullScreen()" title="Toggle Fullscreen" style="background:rgba(255,255,255,0.18);border:1px solid rgba(255,255,255,0.4);color:#fff;border-radius:6px;padding:8px 16px;cursor:pointer;font-size:0.85rem;font-weight:600">⛶ Fullscreen</button>
    </header>

    <!-- Task Form -->
    <form id="task-form" class="form-row">
      <input type="hidden" id="task-id">
      <div class="fg task-fg"><label>Task</label><input type="text" id="task-name" placeholder="Complete Python Assignment" required></div>
      <div class="fg"><label>Category</label><select id="task-cat"><option>Study</option><option>Personal</option><option>Work</option><option>Health</option><option>Other</option></select></div>
      <div class="fg"><label>Priority</label><select id="task-priority"><option>Low</option><option selected>Medium</option><option>High</option></select></div>
      <div class="fg"><label>Status</label><select id="task-status"><option selected>Pending</option><option>Completed</option></select></div>
      <div class="fg btn-group"><button type="submit" id="sub-btn" class="btn btn-blue">Add Task</button><button type="button" id="cancel-btn" class="btn btn-gray" style="display:none">Cancel</button></div>
    </form>

    <!-- Search & Filter Controls -->
    <div class="filter-bar">
      <input type="text" id="search" placeholder="🔍 Search tasks by name...">
      <select id="filter-cat"><option value="all">All Categories</option><option>Study</option><option>Personal</option><option>Work</option><option>Health</option><option>Other</option></select>
      <select id="filter-priority"><option value="all">All Priorities</option><option>High</option><option>Medium</option><option>Low</option></select>
      <select id="filter-status"><option value="all">All Statuses</option><option>Pending</option><option>Completed</option></select>
      <button id="reset-btn" class="btn btn-sm">Reset</button>
    </div>

    <!-- Task Display Table -->
    <div class="table-wrap">
      <table>
        <thead><tr><th>Task</th><th>Category</th><th>Priority</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody id="task-tbody"></tbody>
      </table>
      <div id="no-task" style="display:none;padding:22px;text-align:center;color:#64748b">No tasks found.</div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
